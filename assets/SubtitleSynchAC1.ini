[Subtitle]
; 1 = show subtitles, 0 = hide all subtitles.
ShowSubtitles=1
; Show bracketed sound descriptions such as [laughs] (1 = on, 0 = off).
ShowSoundCaptions=1
; Subtitle size multiplier (0.5 - 3).
SubtitleFontScale=1
; Largest subtitle width in percent of the screen width (20 - 100).
MaxWidthPercent=65
; Distance of the subtitle from the bottom of the screen, in 1080p pixels.
BottomMargin=100
; The subtitle stays this many ms after the line ends (0 - 10000).
TailExtensionMs=1500
; Main subtitle colour (0 - 1).
SubtitleColorR=1
SubtitleColorG=1
SubtitleColorB=1
SubtitleColorA=1
; Ambient subtitle colour (citizens, guards, preachers), greyer than the main subtitle.
SecondaryColorR=0.72
SecondaryColorG=0.72
SecondaryColorB=0.72
SecondaryColorA=1
; Background opacity behind the text (0 = none, 1 = solid black).
BackgroundColorA=0.5
